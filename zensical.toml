[project]
site_name = "PUDL Diff"
site_description = "Compare two sets of PUDL Parquet outputs, and report on what changed."
site_author = "Catalyst Cooperative"
site_url = "https://docs.catalyst.coop/pudl-diff"
copyright = """
Copyright &copy; 2022-2026 Catalyst Cooperative, CC-BY-4.0
"""
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Usage" = "usage.md" },
  { "Report Schema" = "report_schema.md" },
  "API Reference",
  { "Code of Conduct" = "code_of_conduct.md" },
  { "Changelog" = "changelog.md" },
  { "Implementation Plan" = "implementation_plan.md" },
  { "License" = "license.md" },
]

[project.theme]
language = "en"
logo = "_static/catalyst_logo-200x200.png"
favicon = "_static/favicon.ico"

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/catalyst-cooperative/pudl-diff"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/catalyst.coop"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://mastodon.energy/@CatalystCoop"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/catalyst-cooperative/"

[[project.extra.social]]
icon = "fontawesome/solid/donate"
link = "https://opencollective.com/pudl"
name = "Support us on Open Collective"

# The API reference is generated from the package's docstrings: `api-autonav` (native to
# Zensical) writes a page for each module of the package, and puts them in the nav where
# the "API Reference" entry is, and mkdocstrings renders them. The cross-references
# between pages, written as [`name`][full.path.to.name], are resolved by Zensical's
# native autorefs, which mkdocstrings feeds with every documented object.
[project.plugins.api-autonav]
modules = ["src/pudl_diff"]
nav_section_title = "API Reference"
api_root_uri = "reference"
exclude_private = true
# Every entry is a module, so the default prefix, a "mod" badge, says nothing. The theme
# colors the badge but doesn't space it from the title, and the badge's markup also ends
# up in the aria-label of the previous and next page links.
nav_item_prefix = ""

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
# Without a heading for each module, its members are bare top-level headings that run
# together in the page and the sidebar, with nothing showing which module they're in.
show_root_heading = true
show_root_full_path = true
show_source = true

# Setting any markdown_extensions replaces Zensical's default set wholesale rather than
# adding to it, so this table is that default set (minus math, which nothing here
# uses) plus the two extensions the defaults lack: snippets and configured magiclink.
# Zensical's own defaults are in zensical/config.py, DEFAULT_MARKDOWN_EXTENSIONS.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
# Enables shorthand references instead of full Markdown links: `#123` for issues,
# `!123` for pull requests, `@user` for users, and raw commit SHAs -- all resolved
# against the `user`/`repo` below unless another owner/repo is spelled out explicitly.
[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
social_url_shorthand = true
user = "catalyst-cooperative"
repo = "pudl-diff"
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
# Includes README.md and LICENSE.txt in pages with `--8<-- "file"`.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
