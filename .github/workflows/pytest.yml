---
name: pytest

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Lint, type check, and check that all of src/ is type annotated
        # ruff and formatting are also checked by pre-commit.ci, but pyrefly is not
        # (see .pre-commit-config.yaml's "pyrefly" hooks and their `ci.skip` entry),
        # so this runs all of them: ruff, pyrefly, and the type coverage of src/.
        run: pixi run lint

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Run PyTest with coverage
        run: pixi run test

      - name: Upload test coverage report to CodeCov
        # Coverage is the same on every platform, so upload it once.
        #
        # CODECOV_TOKEN here is the catalyst-cooperative org's shared "Global Upload
        # Token" (an organization-level secret, not a per-repo one -- see
        # .codecov.yml), not a repo-specific secret we need to mint per project.
        # Coverage reporting failing shouldn't fail this required check on its own,
        # since it's orthogonal to whether the tests passed.
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
