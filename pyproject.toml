[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs>=0.5", "hatchling>=1.32"]

[project]
# This is the *installed* package name, not the imported name.
name = "catalystcoop.pudl_diff"
description = "Compare two sets of PUDL Parquet outputs, and report on what changed."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Catalyst Cooperative", email = "pudl@catalyst.coop" }]
requires-python = ">=3.14"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
  "click>=8.5",
  "gcsfs>=2026",
  "polars>=1.43",
  "psutil>=7",
  "pydantic>=2.13",
  "s3fs>=2026",
  "universal-pathlib>=0.3.10",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
keywords = [
  "pudl",
  "parquet",
  "data comparison",
  "diff",
  "data validation",
  "energy",
]

[project.scripts]
# "script_name = dotted.module.path.to:main_script_function",
pudl_diff = "pudl_diff.cli:main"

[project.urls]
"Homepage" = "https://docs.catalyst.coop/pudl-diff"
"Source" = "https://github.com/catalyst-cooperative/pudl-diff"
"Documentation" = "https://docs.catalyst.coop/pudl-diff"
"Issue Tracker" = "https://github.com/catalyst-cooperative/pudl-diff/issues"
"Funding" = "https://opencollective.com/pudl"

[project.optional-dependencies]
dev = [
  "build>=1.6", # PEP 517 build frontend, used to build the sdist/wheel
  "prek>=0.5", # Fast Rust-based pre-commit hook runner
  "twine>=7", # Used to make releases to PyPI
]
docs = [
  "mkdocstrings-python>=2", # Renders API docs from docstrings, used by zensical
  "zensical>=0.0.63", # Markdown-based static site generator for docs
]
lint = [
  "mdformat-mkdocs>=5", # Stops mdformat from mangling zensical/MkDocs markdown syntax
  "ruff>=0.16", # A very fast python linter & autofixer
]
tests = [
  "coverage>=7.16", # Lets us track what code is being tested
  "jsonschema>=4.26", # Validates reports against their JSON Schema
  "numpy>=2.5", # Used to check float comparisons against numpy's
  "pytest-console-scripts>=1.4.1", # Allow automatic testing of scripts
  "pytest-cov>=7.1", # Pytest plugin for working with coverage
  "pytest-mock>=3.15", # The mocker fixture
  "pytest>=9", # Our testing framework
]
types = [
  "pyrefly>=1.3", # Fast Rust-based Python type checker, from Meta
  "types-jsonschema>=4.26", # Type stubs for jsonschema, used in the tests
  "types-psutil>=7", # Type stubs for psutil
]

[tool.hatch.version]
# Derive the package version from the latest git tag, rather than storing it in the
# repository and manually updating it.
source = "vcs"

[tool.hatch.build.targets.wheel]
# hatchling can't auto-detect the package directory here because the distribution
# name (catalystcoop.pudl_diff) doesn't match the importable package name (pudl_diff).
packages = ["src/pudl_diff"]

[tool.pytest]
testpaths = ["."]
# So that the tests can import the scripts.
pythonpath = ["scripts"]
# Warnings are errors, so that they get fixed (or deliberately filtered here, with a
# reason) instead of piling up unread.
filterwarnings = ["error"]
# Errors on unknown config keys and markers, unexpected passes of xfail tests, and
# parametrized tests whose IDs aren't unique.
strict = true

# Quiet output: one character per test and one line per module. If you need to see the
# names of the tests, or logs as they are emitted, override the options:
#   pytest -v -o log_cli=true tests/unit/foo_test.py
# Failing tests still show the logs they captured, and the reasons that tests were
# skipped or xfailed (-ra), with short tracebacks.
addopts = ["-ra", "--tb=short"]
log_format = "%(asctime)s [%(levelname)8s] %(name)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = false
log_cli_level = "INFO"
# The level of the logs that are captured, and shown for failing tests. Without this
# pytest would capture DEBUG messages too, which are noise in a failure's output.
log_level = "INFO"

[tool.ruff]
# Configurations that apply to both the `format` and `lint` subcommands.
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.format]
# Configuration specfic to the `format` subcommand.
# We use black compatible formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# extend-select adds these to ruff's default rules, rather than replacing them.
extend-select = [
  "A", # flake8-builtins
  "ARG", # find unused arguments
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "BLE", # flake8-blind-except
  "C", # Limit cyclomatic complexity using mccabe
  "C4", # flake8-comprehensions
  "D", # pydocstyle errors
  "E", # pycodestyle errors
  "EXE", # executable file issues
  "F", # pyflakes
  "FA", # flake8-future-annotations
  "FLY", # flynt: convert % and .format() to f-strings
  "FURB", # refurb: general code quality/modernization
  "G", # flake8-logging-format
  "I", # isort
  "ICN", # flake8 import conventions
  "INT", # flake8-gettext
  "ISC", # flake8-implicit-str-concat
  "LOG", # flake8-logging
  "N", # pep8-naming
  "NPY", # NumPy specific checks
  "PERF", # Perflint: performance issues
  "PGH", # pygrep-hooks
  "PL", # Pylint (Convention/Error/Refactor/Warning)
  "PT", # flake8-pytest-style
  "PTH", # use pathlib
  "PYI", # flake8-pyi: type stub conventions
  "Q", # flake8-quotes
  "RET", # check return values
  "RSE", # unnecessary parenthises on raised exceptions
  "RUF", # Ruff-specific rules
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "T10", # flake8-debugger
  "T20", # find print statements that should probably be logging
  "TID", # flake8-tidy-imports
  "TRY", # tryceratops: exception handling anti-patterns
  "UP", # pyupgrade (use modern python syntax)
  "W", # pycodestyle warnings

]
ignore = [
  "D401", # Require imperative mood in docstrings.
  "E501", # Overlong lines.
  "G004", # Logging statement uses f-string
  "PLR0911", # Pylint: Too many return statements
  "PLR0913", # Pylint: Too many arguments
  "PLR0917", # Pylint: Too many positional arguments
  "PLR2004", # Pylint: Magic numbers should be avoided
  "TRY003", # tryceratops: Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D", # Tests don't need docstrings
  "S101", # Tests are made of asserts
  "ARG", # Tests often have unused arguments (fixtures)
]

[tool.ruff.lint.isort]
known-first-party = ["pudl_diff"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.coverage.run]
# Measure the tests and scripts as well as the package, which finds tests that never run,
# and helpers and fixtures nothing uses.
source = ["src/pudl_diff", "tests", "scripts"]
# Count every branch as well as every line, so that a condition that is only ever
# true, or only ever false, in the tests shows up as missing coverage.
branch = true

[tool.coverage.report]
precision = 2
sort = "miss"
skip_empty = true
fail_under = 100
# fail_under is enforced once, after unit and integration coverage are combined, by
# the final "coverage report" invocation in the `test` pixi task below -- not here,
# since pytest-cov would otherwise also enforce it after unit or integration tests
# run on their own, before the other suite gets a chance to contribute its coverage.
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",
]

[tool.pyrefly]
# Check the tests too: they are typed like everything else, and the checker runs in the
# full pixi environment, so it can resolve the test dependencies.
project-includes = ["src", "tests", "scripts"]
search-path = ["scripts"]
python-version = "3.14"
python-platform = "linux"
python-interpreter-path = ".pixi/envs/default/bin/python3"
# Strict for the package that gets published with a py.typed marker. The tests are
# only exempt from the rules that demand annotating every fixture argument and
# container; everything else applies to them too.
preset = "strict"
# Any written out explicitly is as good as no type at all, so the tests and scripts
# have to say what they mean too. JSON is described by the types in datapackage.py, or
# by pydantic's own JsonSchemaValue for a JSON Schema.
errors = { explicit-any = true }
sub-config = [
  { matches = "tests/**", errors = { implicit-any-parameter = false, implicit-any-type-argument = false, implicit-any-lambda = false, implicit-any-empty-container = false } },
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-aarch64", "osx-arm64", "linux-64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
# Install this package itself in editable mode, pulling in every optional-dependency
# group defined above (see [project.optional-dependencies]) so the whole development
# toolchain is available. Spelled out explicitly here, rather than relying on pixi's
# implicit "a feature with the same name as an extra pulls in that extra" behavior,
# so it's obvious at a glance which extras are actually installed.
"catalystcoop.pudl_diff" = { path = ".", editable = true, extras = [
  "dev",
  "docs",
  "lint",
  "tests",
  "types",
] }

# Non-Python formatting tools that aren't published to PyPI, so they can't be
# expressed as project.optional-dependencies extras and added above.
[tool.pixi.feature.lint.dependencies]
markdownlint-cli2 = ">=0.23.0"
mdformat = ">=1.0.0"
mdformat-gfm = ">=1.0.0"
mdformat-frontmatter = ">=2.1"
prettier = ">=3.9.3"
taplo = ">=0.10.0"
uv = ">=0.12" # Runs standalone scripts (PEP 723), e.g. pyrefly-coverage-report

# A single environment with everything needed for local development, since this is a
# small template repository that doesn't benefit from separate per-task environments.
# "lint" is the only named feature to add here -- it's the one place we need conda
# (rather than PyPI) packages -- everything else comes from the extras listed above.
[tool.pixi.environments]
default = { features = ["lint"], solve-group = "default" }

[tool.pixi.tasks]
test-erase = { cmd = "coverage erase", description = "Wipe previously recorded coverage data before the test suites run." }
test-unit = { cmd = "pytest --cov --cov-append --cov-report= --cov-fail-under=0 src/pudl_diff tests/unit", depends-on = [
  "test-erase",
], description = "Run unit tests with coverage instrumentation." }
test-integration = { cmd = "pytest --cov --cov-append --cov-report= --cov-fail-under=0 tests/integration", depends-on = [
  "test-erase",
], description = "Run integration tests with coverage instrumentation." }
test = { cmd = "coverage xml --quiet && coverage report --sort=cover", depends-on = [
  "test-unit",
  "test-integration",
], description = "Run all tests and report combined coverage, failing if it's below the configured threshold." }

lint-ruff = { cmd = "ruff check . && ruff format --check .", description = "Check code style, correctness and formatting with ruff, without modifying files." }
lint-pyrefly = { cmd = "pyrefly check", description = "Type check the code with pyrefly." }
# Type coverage is only measured against src/, not tests/: pyrefly can't derive stable
# per-module names for the test suite, so it reports those files under a single
# "__unknown__" bucket that would distort the overall percentage.
lint-pyrefly-coverage = { cmd = "pyrefly coverage check --fail-under 100 src", description = "Fail if any part of src/ is missing type annotations." }
pyrefly-coverage-report = { cmd = "pyrefly coverage report src | uv run scripts/pyrefly_coverage_summary.py", description = "Show the type annotation coverage of each module in src/." }
lint = { depends-on = [
  "lint-ruff",
  "lint-pyrefly",
  "lint-pyrefly-coverage",
], description = "Run all linters and type checks, without modifying files." }

format-ruff = { cmd = "ruff format . && ruff check --fix .", description = "Reformat code and auto-fix lint issues with ruff." }
format-toml = { cmd = "taplo fmt pyproject.toml zensical.toml", description = "Reformat TOML files with taplo." }
format-md = { cmd = "mdformat --exclude docs/report_schema.md README.md AGENTS.md docs", description = "Reformat Markdown files with mdformat." }
format-yaml = { cmd = "prettier --write '**/*.{yaml,yml}'", description = "Reformat YAML files with prettier." }
format = { depends-on = [
  "format-ruff",
  "format-toml",
  "format-md",
  "format-yaml",
], description = "Run all formatters, modifying files in place." }

docs-build = { cmd = "zensical build", description = "Build the documentation with Zensical into site/." }
docs-serve = { cmd = "zensical serve", description = "Serve the documentation locally, rebuilding on changes." }

prek-update = { cmd = "prek update", description = "Bump the `rev` pins in .pre-commit-config.yaml to their latest tagged versions. Used by .github/workflows/update-lockfiles.yml; see also `pixi update` for refreshing pixi.lock itself." }

build = { cmd = "python -m build && twine check --strict dist/*", description = "Build the sdist and wheel, and verify them with twine." }
